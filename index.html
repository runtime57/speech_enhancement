<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speech Enhancement Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <h1>Speech Enhancement Demo</h1>

    <div class="sample-block" data-sample="sample1">
      <h2>sample1</h2>

      <div class="spectrogram-card">
        <img class="spectrogram" src="images/noisy/sample1.png" alt="Spectrogram for sample1" />
      </div>

      <div class="buttons">
        <button class="variant-btn active" data-variant="noisy">noisy</button>
        <button class="variant-btn" data-variant="clean">clean</button>
        <button class="variant-btn" data-variant="dfnet">dfnet</button>
        <button class="variant-btn" data-variant="grnn">grnn</button>
        <button class="variant-btn" data-variant="xdws+grnn">xdws+grnn</button>
      </div>

      <div class="player-card">
        <audio class="audio-player" controls>
          <source class="audio-source" src="audio/noisy/sample1.wav" type="audio/wav" />
          Your browser does not support the audio element.
        </audio>
      </div>
    </div>

    <div class="sample-block" data-sample="sample2">
      <h2>sample2</h2>

      <div class="spectrogram-card">
        <img class="spectrogram" src="images/noisy/sample2.png" alt="Spectrogram for sample2" />
      </div>

      <div class="buttons">
        <button class="variant-btn active" data-variant="noisy">noisy</button>
        <button class="variant-btn" data-variant="clean">clean</button>
        <button class="variant-btn" data-variant="dfnet">dfnet</button>
        <button class="variant-btn" data-variant="grnn">grnn</button>
        <button class="variant-btn" data-variant="xdws+grnn">xdws+grnn</button>
      </div>

      <div class="player-card">
        <audio class="audio-player" controls>
          <source class="audio-source" src="audio/noisy/sample2.wav" type="audio/wav" />
          Your browser does not support the audio element.
        </audio>
      </div>
    </div>

    <div class="sample-block" data-sample="sample3">
      <h2>sample3</h2>

      <div class="spectrogram-card">
        <img class="spectrogram" src="images/noisy/sample3.png" alt="Spectrogram for sample3" />
      </div>

      <div class="buttons">
        <button class="variant-btn active" data-variant="noisy">noisy</button>
        <button class="variant-btn" data-variant="clean">clean</button>
        <button class="variant-btn" data-variant="dfnet">dfnet</button>
        <button class="variant-btn" data-variant="grnn">grnn</button>
        <button class="variant-btn" data-variant="xdws+grnn">xdws+grnn</button>
      </div>

      <div class="player-card">
        <audio class="audio-player" controls>
          <source class="audio-source" src="audio/noisy/sample3.wav" type="audio/wav" />
          Your browser does not support the audio element.
        </audio>
      </div>
    </div>
  </div>

  <script>
    function getPaths(sample, variant) {
      if (variant === "noisy") {
        return {
          audio: `audio/noisy/${sample}.wav`,
          image: `images/noisy/${sample}.png`
        };
      }

      if (variant === "clean") {
        return {
          audio: `audio/clean/${sample}.wav`,
          image: `images/clean/${sample}.png`
        };
      }

      return {
        audio: `audio/enhanced/${variant}/${sample}.wav`,
        image: `images/enhanced/${variant}/${sample}.png`
      };
    }

    const sampleBlocks = document.querySelectorAll(".sample-block");

    sampleBlocks.forEach((block) => {
      const sample = block.dataset.sample;
      const spectrogram = block.querySelector(".spectrogram");
      const audioPlayer = block.querySelector(".audio-player");
      const audioSource = block.querySelector(".audio-source");
      const buttons = block.querySelectorAll(".variant-btn");

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((btn) => btn.classList.remove("active"));
          button.classList.add("active");

          const variant = button.dataset.variant;
          const paths = getPaths(sample, variant);

          spectrogram.src = paths.image;
          audioSource.src = paths.audio;
          audioPlayer.load();
        });
      });
    });
  </script>
</body>
</html>
