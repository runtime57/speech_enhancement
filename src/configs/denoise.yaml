defaults:
  - model: rebalancedgrnn
  - _self_

denoise:
  noisy_dir: "audio/noisy"
  output_dir: "audio/enhanced/rebalanced"
  from_pretrained: "models/rebalanced_1.pth"
  device: auto
  seed: 1

stft:
  sr: 16000
  fft_size: 320
  hop_length: 160
  nb_erb: 24
  nb_df: 96
  norm_tau: 1
  lsnr_max: 35
  lsnr_min: -15
  min_nb_freqs: 1
  df_order: 5
  df_lookahead: 1
  pad_mode: input
