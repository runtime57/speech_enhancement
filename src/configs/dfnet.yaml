defaults:
  - model: deepfilternet
  - writer: dfnet
  - metrics: dfnet
  - datasets: vctk_validation
  - dataloader: train
  - transforms: example
  - _self_
optimizer:
  _target_: torch.optim.Adam
  lr: 1e-3
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: 3
loss_function:
  _target_: src.loss.Loss
  mask_factor: 0.0
  spec_factor_magnitude: 1.0
  spec_factor_complex: 1.0
  spec_gamma: 0.6
  spec_frequency_reduction: sum
  mr_factor: 0.0
  mr_factor_complex: 0.0
  sdr_factor: 0.0
  # keep only Eq. (8): L = λ_spec * L_spec + λ_α * L_α
  lsnr_factor: 0.0
  alpha_factor: 0.05
  alpha_lsnr_low: -10.0
  alpha_lsnr_high: -5.0
  mask_f_under: 1
trainer:
  amp: true
  amp_dtype: float16
  amp_init_scale: 64.0
  lr_scheduler_interval: epoch
  evaluation_partitions: [val]
  skip_oom: false
  log_step: 50
  n_epochs: 100
  epoch_len: null
  device_tensors: ["noisy", "clean"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: False # preserve previous experiments
  monitor: "min val_loss"
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: 10 # validation-loss patience; n_epochs remains the maximum budget
  save_dir: "saved"
  seed: 1

# если поменять его здесь, то надо и в denoise.yam
stft:
  sr: 16000
  fft_size: 320
  hop_length: 160
  nb_erb: 24
  nb_df: 96
  norm_tau: 1
  lsnr_max: 35
  lsnr_min: -15
  min_nb_freqs: 1
  df_order: 5
  df_lookahead: 1
  pad_mode: input
